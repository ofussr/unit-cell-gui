[package]
name = "unit-cell-gui-native"
version = "0.3.0"
edition = "2024"
description = "Native geometry and OpenGL command engine for unit-cell-gui"
license = "MIT"
repository = "https://github.com/ofussr/unit-cell-gui"
[lib]
name = "_ucg_native"
crate-type = ["cdylib"]
[dependencies]
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py310"] }
[profile.release]
lto = "thin"
codegen-units = 1
